services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: freska_api
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=freska
      - DB_USERNAME=freska_user
      - DB_PASSWORD=freska_secret
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - freska_network

  mysql:
    image: mysql:8.0
    container_name: freska_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: freska
      MYSQL_USER: freska_user
      MYSQL_PASSWORD: freska_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - freska_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freska_network

  redis:
    image: redis:7.2-alpine
    container_name: freska_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - freska_redis_data:/data
    networks:
      - freska_network

networks:
  freska_network:
    driver: bridge

volumes:
  freska_mysql_data:
  freska_redis_data:
