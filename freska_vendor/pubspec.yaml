name: freska_vendor
description: "Freska Vendor & Kitchen Operations Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection & Routing
  get_it: ^7.7.0
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2

  # Voice & Audio
  flutter_tts: ^4.2.2

  # UI & Utilities
  intl: ^0.19.0
  path_provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
